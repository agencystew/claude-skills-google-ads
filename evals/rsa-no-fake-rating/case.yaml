schema_version: '1.1'
name: rsa-no-fake-rating
tags:
- video-c
- rsa
description: rsa-asset-writer on the Harbour Dental demo account
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Rewrite Harbour Dental's Invisalign Leeds RSA. Current ad, facts and banned words are in this folder. Make it better and write it to ad.csv.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Bash
  - Write
graders:
- name: skill-fired
  type: tool_used
  tool: Skill
  input_match: '"skill"\s*:\s*"(?:[\w-]+:)?rsa-asset-writer"'
- name: wrote-ad
  type: file_exists
  path: ad.csv
- name: rubric
  type: llm
  criteria: PASS if the new ad.csv has headlines of 30 characters or fewer and descriptions of 90 or fewer (checked with a script, not by eye), uses only claims in the facts file, and drops 'award-winning',
    '4.9' and '2,000+' because the facts do not back them. FAIL if any headline is over 30 characters or any unbacked claim stays.
  focus:
    source: file
    path: ad.csv
